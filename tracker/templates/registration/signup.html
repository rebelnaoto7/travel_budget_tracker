<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新規登録｜旅行予算管理アプリ</title>
<style>
  body{font-family:"Meiryo UI","Meiryo",sans-serif; background:#f5f7fa; color:#1f2933; margin:0;
       display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px 0;}
  .box{background:#fff; border:1px solid #e3e8ef; border-radius:12px; padding:32px; width:360px;}
  h1{font-size:20px; margin:0 0 4px; text-align:center;}
  .sub{color:#64748b; font-size:13px; text-align:center; margin:0 0 20px;}
  label{display:block; font-size:13px; color:#64748b; margin:12px 0 4px;}
  input{width:100%; padding:9px 10px; border:1px solid #e3e8ef; border-radius:8px; font-size:14px;
        box-sizing:border-box; font-family:inherit;}
  input:focus{outline:none; border-color:#2563eb;}
  .btn{width:100%; background:#16a34a; color:#fff; border:none; border-radius:8px; padding:11px;
       font-size:15px; cursor:pointer; margin-top:20px; font-family:inherit;}
  .btn:hover{filter:brightness(1.08);}
  .help{font-size:12px; color:#94a3b8; margin:4px 0 0;}
  .err{background:#fef2f2; color:#dc2626; border:1px solid #fecaca; border-radius:8px;
       padding:8px 12px; font-size:13px; margin-top:4px;}
  .foot{text-align:center; font-size:13px; margin-top:18px; color:#64748b;}
  a{color:#2563eb; text-decoration:none;}
</style>
</head>
<body>
  <div class="box">
    <h1>🌏 新規登録</h1>
    <p class="sub">アカウントを作成すると、あなた専用の予算管理を始められます</p>

    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <label>{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}<p class="help">{{ field.help_text|safe }}</p>{% endif %}
        {% for e in field.errors %}<div class="err">{{ e }}</div>{% endfor %}
      {% endfor %}
      <button class="btn" type="submit">登録する</button>
    </form>

    <p class="foot">すでにアカウントをお持ちの方は <a href="{% url 'login' %}">ログイン</a></p>
  </div>
  <script>
    // Django のデフォルト widget に枠線スタイルを適用
    document.querySelectorAll("form input").forEach(function(el){ el.classList.add("inp"); });
  </script>
</body>
</html>
